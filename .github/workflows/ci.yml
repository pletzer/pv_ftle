name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ftle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 2
      NUMBA_NUM_THREADS: 2
      OUT: ${{ github.workspace }}/ci_out

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          python -m pip install --upgrade pip
          # CMakeLists.txt calls `python -m pybind11`, so pybind11 must be
          # importable by the `python` on PATH (no build isolation).
          pip install setuptools wheel pybind11

      - name: Install pv_ftle
        run: |
          pip install --no-build-isolation .
          # extra runtime deps of wrf_ftle not listed in setup.py
          pip install scipy xarray numba pyvista

      - name: Run FTLE cases
        run: tests/run_cases.sh "$OUT"

      - name: Compare with reference (rtol 1e-4 on FTLE min/max)
        run: python tests/check_outputs.py "$OUT" --rtol=1e-4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftle-outputs
          path: ci_out/
          retention-days: 7
