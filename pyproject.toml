[build-system]
# scikit-build-core drives the build; pip will install these at build time
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.11",
  "numpy>=1.22",           # if your C++ or Python uses NumPy arrays
  "setuptools_scm>=8.0; python_version>='3.8'",  # optional, if you want dynamic versioning
]
build-backend = "scikit_build_core.build"

[project]
name = "pv_ftle"
# Use either a static version or dynamic via setuptools_scm
version = "0.1.0"
# dynamic = ["version"]     # uncomment if using setuptools_scm + __version__-less mode
description = "Finite-Time Lyapunov Exponent (FTLE) utilities and ParaView plugin helper"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Alexander Pletzer" }
]
keywords = ["FTLE", "pybind11", "ParaView", "VTK"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=1.22",
  "netCDF4>=1.7",
  "vtk>=9.2",
]

[project.urls]
Homepage = "https://github.com/<your-org-or-user>/pv_ftle"
Issues = "https://github.com/<your-org-or-user>/pv_ftle/issues"

[project.scripts]
# Expose CLI: `palm_ftle`
palm_ftle = "pv_ftle.palm_ftle:cli"

[tool.scikit-build]
# Tell scikit-build-core where to find your Python packages
# If you use src/ layout (recommended):
wheel.packages = ["src/pv_ftle"]

# Optional: pass CMake args or set minimum CMake
cmake.minimum-version = "3.18"
# You can add generator or toolchain options here if needed.

# Optional: if you want editable installs to build the extension in place:
# editable.mode = "redirect"

# If using setuptools_scm for dynamic versioning:
# [tool.setuptools_scm]
# version_file = "src/pv_ftle/__version__.py"
